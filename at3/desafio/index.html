
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal da Escola</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header id="cabecalho">
        <h1>Escola Nova Geração</h1>
        <p class="texto">Educação para transformar o futuro</p>
    </header>

    <!-- Banner -->
    <section class="banner">
        <h2 class="titulo">Bem-vindo ao nosso portal!</h2>
        <p class="texto">Conheça nossa escola e nossos cursos</p>
    </section>

    <!-- Cursos -->
    <section class="cursos">
        <h2 class="titulo">Nossos Cursos</h2>

        <p class="texto">Informática</p>
        <p class="texto">Administração</p>
        <p class="texto">Desenvolvimento de Sistemas</p>
    </section>

    <!-- Contato -->
    <section class="contato">
        <h2 class="titulo">Contato</h2>

        <p class="texto">Telefone: (11) 99999-9999</p>
        <p class="texto">Email: contato@escolanovageracao.com</p>
    </section>

    <!-- Rodapé -->
    <footer class="rodape">
        <p class="texto">Escola Nova Geração - 2026</p>
    </footer>

</body>
</html>
